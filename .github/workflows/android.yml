name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Parser and settings tests
        working-directory: phonekey
        run: chmod +x gradlew && ./gradlew :core:test --no-daemon --stacktrace

  debug-apk:
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        working-directory: phonekey
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Source zip
        run: zip -r phonekey-source.zip phonekey -x 'phonekey/**/build/*' 'phonekey/.gradle/*' 'phonekey/**/.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: phonekey-debug
          path: |
            phonekey/app/build/outputs/apk/debug/*.apk
            phonekey-source.zip
      - name: Signed release, when a keystore secret exists
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: phonekey
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret. Publishing the debug APK only."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/phonekey.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/phonekey.jks" ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Publish the tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            phonekey/app/build/outputs/apk/debug/*.apk
            phonekey/app/build/outputs/apk/release/*.apk
            phonekey-source.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
