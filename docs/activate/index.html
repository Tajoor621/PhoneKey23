<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PhoneKey is free</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --canvas: #10140f; --fg: #f3f0e7; --muted: #a8ad9f; --brass: #e0b15a; --ink: #1a1408; }
    body { margin: 0; background: var(--canvas); color: var(--fg); font-family: Outfit, ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 36rem; margin: 0 auto; padding: 4rem 1.5rem; }
    h1 { font-family: Fraunces, ui-serif, Georgia, serif; font-size: 2.5rem; line-height: 1.1; font-weight: 560; }
    p { color: var(--muted); font-size: 1.125rem; line-height: 1.5; }
    a.btn { display: flex; align-items: center; justify-content: center; height: 3rem; margin-top: 1rem; border-radius: 1rem; background: var(--brass); color: var(--ink); font-weight: 600; text-decoration: none; }
    a.quiet { color: var(--brass); }
  </style>
</head>
<body>
  <main>
    <h1>PhoneKey is free. No ads. No subscriptions.</h1>
    <p>No accounts and no license check. Your WireGuard keys stay on the phone. Xray and SSTP are not implemented.</p>
    <a class="btn" href="phonekey://activate">Open in the app</a>
    <p><a class="quiet" href="../">Back to PhoneKey</a></p>
  </main>
</body>
</html>
